server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1000;

    # ── SEO / static root files ────────────────────────────────────────
    # Exact-match blocks short-circuit BEFORE the SPA fallback so these
    # paths can never be served as /index.html. If the file is missing,
    # return a real 404 (which Google handles correctly).
    location = /robots.txt {
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /site.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /og.webp {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /favicon.ico {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /favicon-16x16.png {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /favicon-32x32.png {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /apple-touch-icon.png {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /android-chrome-192x192.png {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /android-chrome-512x512.png {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ── Hashed asset bundles ────────────────────────────────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA shell ───────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── Backend proxy ───────────────────────────────────────────────────
    # Use Docker's embedded DNS server with a short TTL, and put the upstream
    # hostname in a variable. This forces nginx to re-resolve per-request
    # instead of caching the IP at startup forever — without this, when
    # wrlt-backend restarts and gets a new internal IP, this nginx keeps
    # trying the dead old IP until manually restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream "wrlt-backend:8787";
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # If the resolver fails or the upstream is unreachable, fail fast
        # rather than hanging the request — easier to spot in logs.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}